<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta Tutor | Final</title>
    <link rel="stylesheet" href="style.css">
    <!-- Biblioteca usada apenas para gerar o certificado em PDF no navegador.
         Não é um framework, é só uma lib de geração de arquivo, então continua HTML/CSS/JS puro. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div id="app" style="max-width: 800px; margin: auto;">
    <h1>Conecta Tutor</h1>

    <!-- ===================== TELA DE LOGIN / CADASTRO ===================== -->
    <section id="auth-section" class="card">
        <div id="login-box">
            <h2>Login</h2>
            <input type="email" id="l-email" placeholder="E-mail">
            <input type="password" id="l-senha" placeholder="Senha">
            <button onclick="fazerLogin()">Entrar</button>
            <button onclick="alternarAuth()" style="background:#666">Criar Conta</button>
        </div>
        <div id="reg-box" class="hidden">
            <h2>Cadastro Aluno</h2>
            <input type="text" id="r-nome" placeholder="Nome">
            <input type="email" id="r-email" placeholder="E-mail">
            <input type="password" id="r-senha" placeholder="Senha">
            <button onclick="salvarCadastro()">Cadastrar</button>
            <button onclick="alternarAuth()" style="background:#666">Voltar</button>
        </div>
    </section>

    <!-- ===================== PAINEL DO ALUNO ===================== -->
    <section id="aluno-dash" class="hidden card">
        <h3>Aluno: <span id="aluno-nome-txt"></span></h3>
        <div class="nav-bar">
            <button onclick="mostrarAba('busca')">🔍 Tutores</button>
            <button onclick="mostrarAba('historico')">📚 Minhas Aulas</button>
            <button class="btn-logout" onclick="location.reload()">Sair</button>
        </div>

        <!-- Aba de busca de tutores, agora com filtro por matéria -->
        <div id="aba-busca">
            <div class="filtro-bar">
                <label for="filtro-materia"><strong>Filtrar por matéria:</strong></label>
                <select id="filtro-materia" onchange="renderTutores(this.value)">
                    <option value="todas">Todas</option>
                </select>
            </div>
            <div id="lista-tutores"></div>
        </div>

        <div id="aba-historico" class="hidden"><div id="lista-aulas-aluno"></div></div>
    </section>

    <!-- ===================== PAINEL DO PROFESSOR ===================== -->
    <section id="prof-dash" class="hidden card">
        <h3>Painel do Professor: <span id="prof-nome-txt"></span></h3>
        <div class="nav-bar">
            <button onclick="mostrarAbaProf('solicitacoes')">
                📋 Solicitações <span id="badge-pendentes" class="badge hidden">0</span>
            </button>
            <button onclick="mostrarAbaProf('disponibilidade')">🗓️ Minha Disponibilidade</button>
            <button class="btn-logout" onclick="location.reload()">Sair</button>
        </div>

        <div id="aba-solicitacoes"><div id="lista-solicitacoes"></div></div>

        <!-- Nova aba: professor cadastra os próprios horários livres -->
        <div id="aba-disponibilidade" class="hidden">
            <div class="card" style="background:#f8fafc;">
                <h4>Adicionar horário livre</h4>
                <input type="date" id="disp-data">
                <select id="disp-hora">
                    <option value="09:00">09:00</option>
                    <option value="14:00">14:00</option>
                    <option value="20:00">20:00</option>
                </select>
                <button onclick="adicionarDisponibilidade()">Adicionar</button>
            </div>
            <div id="lista-disponibilidade"></div>
        </div>
    </section>
</div>
<!-- Cada arquivo abaixo pertence a um integrante. A ordem de carregamento
     não afeta o funcionamento, porque as funções só são EXECUTADAS depois
     que o usuário clica em algo, quando todos os arquivos já terminaram
     de carregar. Só o core.js precisa vir primeiro por conter os dados. -->
<script src="js/core.js"></script>
<script src="js/disponibilidade.js"></script>
<script src="js/agendamento.js"></script>
<script src="js/chat.js"></script>
<script src="js/certificado.js"></script>
</body>
</html>
